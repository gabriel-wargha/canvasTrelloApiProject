<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CanvasTrelloSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <!-- Set the saved theme before the page draws, so it doesn't flash the wrong colors -->
  <script>
    try {
      const theme = localStorage.getItem("theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch { /* storage blocked: follow the system theme */ }
  </script>
</head>
<body>
  <header class="toolbar">
    <p class="wordmark">CanvasTrelloSync</p>
    <div class="toolbar-actions">
      <span class="mode" id="mode" hidden title="Syncing only shows what would change. Start the app without --dry-run to sync for real.">Preview mode</span>
      <button type="button" class="sync" id="sync-button">
        <span class="spinner" aria-hidden="true"></span>
        <span class="label">Sync</span>
      </button>
      <button type="button" class="theme" id="theme-button" aria-label="Switch between light and dark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <!-- One tab per section, so the page shows one thing at a time -->
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-view="overview">Overview</button>
    <button type="button" role="tab" data-view="todo">To do <span class="tab-count" id="todo-count"></span></button>
    <button type="button" role="tab" data-view="board">Trello board</button>
    <button type="button" role="tab" data-view="log">Sync log</button>
  </nav>

  <main>
    <!-- What the last sync did (or would do, in preview mode); stays visible on every tab -->
    <div class="result" id="result" hidden aria-live="polite"></div>

    <section class="view" id="view-overview" role="tabpanel">
      <h1 id="headline">Loading your assignments…</h1>
      <p class="subline" id="subline"></p>
      <h2>Your courses</h2>
      <div id="courses"><p class="quiet">Loading…</p></div>
    </section>

    <section class="view" id="view-todo" role="tabpanel" hidden>
      <h2 id="todo-title">Still to do</h2>
      <div id="todo"><p class="quiet">Loading…</p></div>
    </section>

    <section class="view" id="view-board" role="tabpanel" hidden>
      <h2>On your Trello board</h2>
      <div id="board"><p class="quiet">Loading…</p></div>
    </section>

    <section class="view" id="view-log" role="tabpanel" hidden>
      <h2>Sync log</h2>
      <div id="history"><p class="quiet">Loading…</p></div>
    </section>
  </main>

  <!-- Asked inside the page before a real sync (never in preview mode) -->
  <dialog id="confirm" aria-labelledby="confirm-title">
    <h3 id="confirm-title">Sync with your real Trello board?</h3>
    <p>Cards will be created and moved on <b id="confirm-board">your board</b>.</p>
    <div class="dialog-actions">
      <button type="button" id="confirm-no">Cancel</button>
      <button type="button" class="sync" id="confirm-yes">Sync with Trello</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
